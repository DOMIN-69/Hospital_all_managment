{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<div class="container mt-4">
    <h2 class="mb-4 text-center">⚙️ System Control & Settings</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-header bg-dark text-white"><h5>🏥 Hospital Profile</h5></div>
                <div class="card-body">
                    <form action="{{ url_for('settings') }}" method="POST">
                        <input type="hidden" name="action_type" value="change_hospital">
                        <div class="mb-3">
                            <label class="form-label">Current Hospital Name</label>
                            <input type="text" class="form-control" name="hospital_name" value="{{ current_hospital_name }}" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Update Title</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-header bg-info text-white"><h5>👤 Change Admin ID</h5></div>
                <div class="card-body">
                    <form action="{{ url_for('settings') }}" method="POST">
                        <input type="hidden" name="action_type" value="change_username">
                        <div class="mb-3">
                            <label class="form-label">Current Username</label>
                            <input type="text" class="form-control text-muted" value="{{ session.get('username') }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Username</label>
                            <input type="text" class="form-control" name="new_username" required>
                        </div>
                        <button type="submit" class="btn btn-info text-white w-100">Change Username</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-header bg-warning text-dark"><h5>🔒 Change Password</h5></div>
                <div class="card-body">
                    <form action="{{ url_for('settings') }}" method="POST" onsubmit="return validatePasswords()">
                        <input type="hidden" name="action_type" value="change_password">
                        
                        <div class="mb-2">
                            <label class="form-label form-control-sm p-0">Current Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-sm" name="current_password" id="current_password" required>
                                <button class="btn btn-outline-secondary btn-sm" type="button" onclick="togglePassword('current_password', 'eye_current')">
                                    <i class="bi bi-eye-slash" id="eye_current"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-control-sm p-0">New Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-sm" name="new_password" id="new_password" required>
                                <button class="btn btn-outline-secondary btn-sm" type="button" onclick="togglePassword('new_password', 'eye_new')">
                                    <i class="bi bi-eye-slash" id="eye_new"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-control-sm p-0">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-sm" name="confirm_password" id="confirm_password" required>
                                <button class="btn btn-outline-secondary btn-sm" type="button" onclick="togglePassword('confirm_password', 'eye_confirm')">
                                    <i class="bi bi-eye-slash" id="eye_confirm"></i>
                                </button>
                            </div>
                        </div>

                        <div id="match_error" class="text-danger small fw-bold mb-2 d-none">
                            ⚠️ New passwords do not match!
                        </div>

                        <button type="submit" class="btn btn-warning w-100 mt-2 btn-sm">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, eyeIconId) {
    var passwordInput = document.getElementById(inputId);
    var eyeIcon = document.getElementById(eyeIconId);
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.classList.remove("bi-eye-slash");
        eyeIcon.classList.add("bi-eye");
    } else {
        passwordInput.type = "password";
        eyeIcon.classList.remove("bi-eye");
        eyeIcon.classList.add("bi-eye-slash");
    }
}

// 🚫 Frontend Validation logic
function validatePasswords() {
    var newPass = document.getElementById('new_password').value;
    var confirmPass = document.getElementById('confirm_password').value;
    var errorDiv = document.getElementById('match_error');

    if (newPass !== confirmPass) {
        errorDiv.classList.remove('d-none'); // Error message show karo
        document.getElementById('new_password').classList.add('is-invalid');
        document.getElementById('confirm_password').classList.add('is-invalid');
        return false; // Form submit nahi hoga!
    }
    
    errorDiv.classList.add('d-none');
    return true; // Password match ho gaye, form submit hone do
}
</script>
{% endblock %}
