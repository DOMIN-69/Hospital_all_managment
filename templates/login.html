<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #343a40;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="card login-card shadow-lg bg-light">
    <div class="card-header bg-dark text-white text-center py-3">
        <h4 class="mb-0">🏥 Admin Panel Login</h4>
    </div>
    <div class="card-body p-4">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Enter Username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" name="password" id="login_password" placeholder="Enter Password" required>
                    <button class="btn btn-outline-secondary bg-white text-muted" type="button" onclick="toggleLoginPassword()">
                        <i class="bi bi-eye-slash" id="login_eye_icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 shadow-sm fw-bold">Sign In →</button>
        </form>
    </div>
</div>

<script>
function toggleLoginPassword() {
    var passwordInput = document.getElementById('login_password');
    var eyeIcon = document.getElementById('login_eye_icon');
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.classList.remove("bi-eye-slash");
        eyeIcon.classList.add("bi-eye");
    } else {
        passwordInput.type = "password";
        eyeIcon.classList.remove("bi-eye");
        eyeIcon.classList.add("bi-eye-slash");
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
