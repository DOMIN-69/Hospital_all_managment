{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white"><h5 class="mb-0">🩺 Add New Doctor</h5></div>
            <div class="card-body">
                <form action="{{ url_for('doctors') }}" method="POST">
                    <div class="mb-2"><label class="form-label">Doctor Name</label><input type="text" class="form-control" name="name" required></div>
                    <div class="mb-2"><label class="form-label">Specialization</label><input type="text" class="form-control" name="specialization" required></div>
                    <div class="mb-2"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone" required></div>
                    <button type="submit" class="btn btn-info text-white w-100 mt-2">Save Doctor</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <form method="GET" action="{{ url_for('doctors') }}" class="row g-2 mb-3">
            <div class="col-md-9">
                <input type="text" name="search" class="form-control" placeholder="Search Doctor by Name or Specialization..." value="{{ search_query }}">
            </div>
            <div class="col-md-3"><button type="submit" class="btn btn-dark w-100">🔍 Search</button></div>
        </form>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white"><h5>📋 Specialist Doctors</h5></div>
            <div class="card-body">
                <table class="table table-hover table-striped">
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        {% for doctor in doctors %}
                        <tr>
                            <td>{{ doctor.id }}</td>
                            <td><strong>Dr. {{ doctor.name }}</strong></td>
                            <td><span class="badge bg-primary">{{ doctor.specialization }}</span></td>
                            <td>{{ doctor.phone }}</td>
                            <td>
                                <a href="{{ url_for('delete_item', type='doctor', id=doctor.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Remove this doctor?')">Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="5" class="text-center text-muted">No doctors found.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
